name: Build and Release TargetCompass

# 当 push tag 时触发
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 配置 Java
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ 设置 Gradle 缓存（可加速）
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4️⃣ 构建 jar
      - name: Build Fabric Mod
        run: ./gradlew build

      # 5️⃣ 重命名 jar 为 TargetCompass-<tag>.jar
      - name: Rename jar
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/libs/*.jar build/libs/TargetCompass-${VERSION}.jar

      # 6️⃣ 创建 Release 并上传文件
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/libs/TargetCompass-${{ github.ref_name }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7️⃣ 上传源代码 zip（可选）
      - name: Upload source code
        uses: softprops/action-gh-release@v1
        with:
          files: |
            $(git archive -o build/TargetCompass-${{ github.ref_name }}-sources.zip HEAD)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
